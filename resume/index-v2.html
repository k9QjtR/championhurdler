<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Tracy Champion — Technical Product Leader specializing in digital commerce, platforms, financial services, and cloud architecture." />
  <title>Tracy Champion | Technical Product Leader</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --surface:#ffffff;
      --text:#172033;
      --muted:#60708a;
      --accent:#173b67;
      --accent-2:#2467a6;
      --line:#dce3ec;
      --chip:#edf3f9;
      --max:1120px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.6;
    }

    a{color:inherit}
    .shell{max-width:var(--max); margin:0 auto; padding:0 24px}

    header{
      background:linear-gradient(135deg,var(--accent),#102c4d);
      color:white;
      padding:72px 0 54px;
    }

    .hero{
      display:grid;
      grid-template-columns:1.3fr .7fr;
      gap:44px;
      align-items:end;
    }

    .eyebrow{
      font-size:.84rem;
      letter-spacing:.15em;
      text-transform:uppercase;
      opacity:.82;
      margin-bottom:12px;
      font-weight:700;
    }

    h1{
      margin:0;
      font-size:clamp(2.6rem,6vw,5.4rem);
      line-height:.95;
      letter-spacing:-.04em;
    }

    .subtitle{
      margin:18px 0 0;
      font-size:clamp(1.05rem,2vw,1.35rem);
      color:#dbe7f2;
      max-width:780px;
    }

    .contact{
      justify-self:end;
      text-align:right;
      font-size:.95rem;
      color:#e7eef6;
    }
    .contact a{text-decoration:none}
    .contact a:hover{text-decoration:underline}
    .contact div{margin:6px 0}

    nav{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }

    .nav-inner{
      max-width:var(--max);
      margin:0 auto;
      padding:0 24px;
      display:flex;
      gap:22px;
      align-items:center;
      min-height:58px;
      overflow-x:auto;
      white-space:nowrap;
    }

    nav a{
      text-decoration:none;
      color:var(--muted);
      font-size:.92rem;
      font-weight:650;
    }
    nav a:hover{color:var(--accent)}

    main{padding:54px 0 70px}
    section{margin:0 0 56px}

    .section-title{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:24px;
    }

    .section-title h2{
      margin:0;
      font-size:1.55rem;
      color:var(--accent);
      letter-spacing:-.02em;
    }

    .section-title::after{
      content:"";
      height:1px;
      flex:1;
      background:var(--line);
    }

    .summary{
      font-size:1.08rem;
      max-width:900px;
      color:#2f3c51;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .chip{
      background:var(--chip);
      border:1px solid #d9e6f2;
      color:#24415f;
      border-radius:999px;
      padding:8px 12px;
      font-size:.9rem;
      font-weight:650;
    }

    .role{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:18px;
      padding:28px;
      margin-bottom:18px;
      box-shadow:0 8px 24px rgba(20,40,70,.05);
    }

    .role-head{
      display:grid;
      grid-template-columns:1fr auto;
      gap:16px;
      align-items:start;
      margin-bottom:8px;
    }

    .role h3{
      margin:0;
      font-size:1.15rem;
      letter-spacing:-.01em;
    }
    .company{
      color:var(--accent-2);
      font-weight:750;
      margin-top:4px;
    }
    .date{
      color:var(--muted);
      font-weight:700;
      white-space:nowrap;
    }

    ul{
      padding-left:1.2rem;
      margin:16px 0 0;
    }
    li{margin:.48rem 0}

    .techline{
      margin-top:18px;
      padding-top:16px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:.93rem;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;
    }
    .card{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:16px;
      padding:22px;
    }
    .card h3{margin:0 0 8px;font-size:1rem;color:var(--accent)}
    .card p{margin:0;color:#344159}

    footer{
      border-top:1px solid var(--line);
      padding:28px 0 42px;
      color:var(--muted);
      font-size:.9rem;
    }

    .print-btn{
      display:inline-block;
      margin-top:18px;
      padding:11px 16px;
      border:1px solid rgba(255,255,255,.55);
      border-radius:10px;
      color:white;
      text-decoration:none;
      font-weight:700;
      cursor:pointer;
      background:transparent;
    }
    .print-btn:hover{background:rgba(255,255,255,.08)}

    @media (max-width:760px){
      header{padding:54px 0 40px}
      .hero{grid-template-columns:1fr; gap:28px}
      .contact{justify-self:start; text-align:left}
      .role-head{grid-template-columns:1fr}
      .grid{grid-template-columns:1fr}
      nav{position:static}
    }

    @media print{
      nav,.print-btn{display:none !important}
      body{background:white;font-size:11pt}
      header{background:white;color:#111;padding:20px 0 16px;border-bottom:2px solid #111}
      .subtitle,.contact{color:#333}
      main{padding:24px 0}
      .role,.card{box-shadow:none;break-inside:avoid}
      .shell{max-width:none;padding:0 16px}
      a{text-decoration:none}
    }
  </style>
    
  <script src="/js/resume.js"></script>
</head>
<body>

<h1 id="resume-name"></h1>
<p id="resume-headline"></p>
<p id="resume-summary"></p>

<header>
    <div class="shell hero">
        <div>
            <div class="eyebrow" id="resume-eyebrow">
                Technical Product Leader
            </div>

            <h1 id="resume-name">
                Tracy Champion
            </h1>

            <p class="subtitle" id="resume-headline">
                Digital Commerce • Platforms • Financial Services • Cloud Architecture
            </p>  

            <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
        </div>

        <div class="contact" aria-label="Contact information">
            <div>
                Middletown, Delaware
            </div>
            
            <div>
                <a href="tel:+12672518302">(267) 251-8302</a>
            </div>
            
            <div>
                <a href="mailto:tracy@championhurdler.com">tracy@championhurdler.com</a>
            </div>
        </div>
    </div>
</header>

<nav>
  <div class="nav-inner">
    <a href="#profile">Profile</a>
    <a href="#expertise">Expertise</a>
    <a href="#experience">Experience</a>
    <a href="#technology">Technology</a>
    <a href="#education">Education</a>
  </div>
</nav>

<main>
    <div class="shell">
        <section id="profile">
            <div id="profile-content">
                <!-- Resume profile populated by API -->
            </div>
        </section>

        <section id="expertise">
            <div class="chips" id="expertise-content">
                <!-- Expertise populated by API -->
            </div>
        </section>

        <section id="experience">
            <div class="section-title">
                <h2>Professional Experience</h2>
            </div>

            <div id="experience-content">
                <!-- Experience populated by API -->
            </div>
        </section>

        <section id="technology">
            <div class="section-title">
                <h2>Technology</h2>
            </div>

            <div class="grid" id="technology-content">
                <!-- Technology populated by API -->
            </div>
        </section>

        <section id="education">
            <div class="section-title">
                <h2>Education</h2>
            </div>

            <div id="education-content">
                <!-- Education populated by API -->
            </div>
        </section>

    </div>
</main>

<footer>
  <div class="shell">
    © 2026 Tracy Champion
  </div>
</footer>

<script src="/js/resume.js"></script>
</body>
</html>
